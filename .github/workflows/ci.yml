name: CI

on:
  push:
  pull_request:

env:
  # 编码通路加固（教训族）：让 CI 全部步骤的 Python stdio 走 UTF-8；
  # 入口护栏（stdio._ensure_utf8_stdio）与 cp1252 复现测试独立于本变量，不受其掩盖。
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.8"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install（与 README 快速开始同一 extras 集合 .[dev]）
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: CLI smoke（python -m 通路）
        run: |
          python -m agent_rework_lens version
          python -m agent_rework_lens selftest

      - name: CLI smoke（裸命令通路）
        run: |
          arl version
          arl selftest
